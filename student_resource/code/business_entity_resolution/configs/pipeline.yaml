# ============================================================
# Business Entity Resolution Pipeline — Configuration
# ============================================================
# Single source of truth for all tunable parameters.
# Edit this file to change behaviour without touching the notebook.

# ── Run mode ─────────────────────────────────────────────────
# "train" : reads dataset/train/, uses ground truth, prints F0.5
# "test"  : reads dataset/test/, writes final submission output
run_mode: "test"

# ── Random seed (reproducibility) ────────────────────────────
random_seed: 42

# ── Train / Validation split (train mode only) ───────────────
# Stratified 80/20 split of Source 1 entities by singleton status.
val_split_ratio: 0.20
val_split_seed: 42

# ── Paths (relative to the notebook's location) ──────────────
paths:
  train_dir: "../../../../dataset/train"
  test_dir:  "../../../../dataset/test"
  output_dir: "../../../../output"
  models_dir: "../../models"

# ── Blocking parameters ───────────────────────────────────────
blocking:
  # Max n-gram prefix length for name-token blocking keys
  name_prefix_len: 5
  # Whether to add phonetic (Soundex) keys for primary name token
  use_soundex: true
  # Whether to add address ZIP/PIN leading-digit key
  use_address_zip: true
  # Max candidates per S1 entity (cap to avoid pathological explosion)
  max_candidates_per_entity: 20
  # Cache blocking output to disk (set true to skip re-blocking during dev)
  cache_enabled: false
  cache_path: "../../models/candidate_pairs_cache.parquet"

# ── Feature names (versioned — must match §4.3 exactly) ──────
features:
  - name_jaccard
  - name_levenshtein_ratio
  - name_tfidf_cosine
  - address_jaccard
  - address_levenshtein_ratio
  - address_tfidf_cosine
  - country_match

# ── Matching model ────────────────────────────────────────────
# Classical gradient-boosted classifier — no pretrained weights,
# trivially satisfies the MIT/Apache-2.0 ≤ 8B-parameter constraint.
matching_model:
  name: "GradientBoostingClassifier (scikit-learn)"
  license: "BSD-3-Clause"          # scikit-learn is BSD-3 (permissive, compatible with submission)
  parameter_count: "N/A (classical ML — no pretrained weights)"
  # Threshold on match_probability for positive prediction
  threshold: 0.5
  # Negative sampling ratio: negatives_per_positive during training
  neg_sample_ratio: 3
  # GBC hyper-parameters
  n_estimators: 100
  max_depth: 5
  learning_rate: 0.1
  subsample: 0.8
  random_state: 42
